# The shared helpers in src/genai_common are an installable package (`pip install -e .`);
# the project folders are standalone scripts, not packages.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "generative-ai-engineering"
version = "0.1.0"
description = "LLM fine-tuning, RL, RAG, agents, multimodal and LLM-safety projects with measured baselines."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]

[project.urls]
Repository = "https://github.com/kishorhange111/generative-ai-engineering"

# Only src/ is a package; the project folders hold standalone train.py scripts.
[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["results"]

[tool.ruff.lint]
# pycodestyle errors/warnings, pyflakes, import sorting, bugbear, pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]
ignore = [
    "B905",   # zip() without strict=: inputs are aligned by construction; strict= would change behaviour
]

[tool.ruff.lint.per-file-ignores]
# Training scripts: a few long, self-explanatory config / print lines
"**/train.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["genai_common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
